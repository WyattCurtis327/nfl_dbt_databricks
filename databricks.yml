# Declarative Automation Bundle. Deploys the NFL dbt job to Databricks.
# https://docs.databricks.com/dev-tools/bundles/
bundle:
  name: nfl

include:
  - resources/*.yml

# Workspace host comes from the Databricks CLI profile (DATABRICKS_CONFIG_PROFILE).
# Do not write the workspace URL in this file. CLI 1.10 compares that host before
# bundle variables are filled in.
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
