name: nfl
version: "1.0.0"
config-version: 2

# Latest semantic YAML needs dbt 1.12 or newer. dbt v2 in VS Code also parses it.
require-dbt-version: [">=1.12.0"]

profile: nfl

# Links this repo to the dbt platform project NFL.
# Ids live in the gitignored .env file. dbt 1.12 and the VS Code extension load it.
# DBT_ENV_SECRET_* cannot be used here. dbt only allows that prefix in profiles.yml.
dbt-cloud:
  project-id: "{{ env_var('DBT_CLOUD_PROJECT_ID') | as_number }}"
  # Deployment environment. The extension defers to this instead of looking up a project default.
  defer-env-id: "{{ env_var('DBT_CLOUD_DEFER_ENV_ID') | as_number }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  nfl:
    +catalog: nfl
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: bronze
      +materialized: table
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
