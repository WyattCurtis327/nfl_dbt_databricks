name: nfl
version: "1.0.0"
config-version: 2

# Latest semantic YAML needs dbt 1.12 or newer. dbt v2 in VS Code also parses it.
require-dbt-version: [">=1.12.0"]

profile: nfl

# Links this repo to the dbt platform project NFL.
# Account wyatts_dbt, host ib010.us1.dbt.com.
dbt-cloud:
  project-id: 70506183172586

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

models:
  nfl:
    +catalog: nfl
    +persist_docs:
      relation: true
      columns: true
    bronze:
      +schema: bronze
      +materialized: table
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
