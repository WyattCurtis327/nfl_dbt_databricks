# Prompts used by `dbt init` if you recreate the local profile.
fixed:
  type: databricks
prompts:
  host:
    hint: Workspace hostname, no https://. Same value as DBT_ENV_SECRET_HOST.
  http_path:
    hint: HTTP path of the SQL warehouse. Same value as DBT_ENV_SECRET_HTTP_PATH.
  catalog:
    hint: Unity Catalog catalog
    default: nfl
  schema:
    hint: schema used when a model does not set one
    default: default
  threads:
    hint: threads to use during development, 1 or more
    type: int
    default: 4
