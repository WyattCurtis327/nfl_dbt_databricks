version: 2

# MetricFlow semantic layer for the gold marts.
# game_summaries and team_performance do not share an entity: a game has two teams.
# metric_time on games is the calendar date of the game, so a January playoff
# game falls in the next calendar year. metric_time on a team season is January 1
# of that season. The week dimension is named game_week because MetricFlow
# reserves the name week for a time grain.

semantic_models:
  - name: game_summaries
    description: One scheduled game, including the closing line and whether the home team covered.
    model: ref('game_summaries')
    defaults:
      agg_time_dimension: gameday
    entities:
      - name: game
        type: primary
        expr: game_id
    dimensions:
      - name: gameday
        type: time
        type_params:
          time_granularity: day
      - name: season
        type: categorical
      - name: game_week
        type: categorical
        expr: week
      - name: game_type
        type: categorical
      - name: home_team
        type: categorical
      - name: away_team
        type: categorical
      - name: over_under_result
        type: categorical
      - name: is_upset
        type: categorical
      - name: beat_spread
        type: categorical
    measures:
      - name: games
        description: Scheduled games, including games that have not been played.
        agg: count
        expr: game_id
      - name: played_games
        description: Games with a final score.
        agg: sum
        expr: case when home_score is not null and away_score is not null then 1 else 0 end
      - name: upsets
        description: Played games the underdog won. A positive spread means the home team was favored by that many points.
        agg: sum_boolean
        expr: is_upset
      - name: upset_decisions
        description: Played games with a non-zero spread, so an upset can be decided.
        agg: sum
        expr: case when is_upset is not null then 1 else 0 end
      - name: home_covers
        description: Played games where the home team beat the spread.
        agg: sum_boolean
        expr: beat_spread
      - name: spread_decisions
        description: Played games with a spread.
        agg: sum
        expr: case when beat_spread is not null then 1 else 0 end
      - name: total_points
        description: Combined points scored in played games.
        agg: sum
        expr: total_score
      - name: avg_total_score
        description: Average combined score of played games.
        agg: average
        expr: total_score
      - name: avg_closing_spread
        description: Average closing spread. Positive means the home team was favored by that many points.
        agg: average
        expr: avg_spread
      - name: avg_closing_total
        description: Average closing total.
        agg: average
        expr: avg_total

  - name: team_performance
    description: One team season, for games that have a final score. Includes the regular season and playoffs.
    model: ref('team_performance_by_season')
    defaults:
      agg_time_dimension: season_start
    entities:
      - name: team_season
        type: primary
        expr: concat(cast(season as string), '_', team)
    dimensions:
      - name: season_start
        type: time
        expr: make_date(cast(season as int), 1, 1)
        type_params:
          time_granularity: year
      - name: season
        type: categorical
      - name: team
        type: categorical
    measures:
      - name: team_seasons
        description: Team seasons with at least one played game.
        agg: count
        expr: team
      - name: team_wins
        description: Wins in played games. A tie is not a win.
        agg: sum
        expr: total_wins
      - name: team_games
        description: Played games.
        agg: sum
        expr: total_games
      - name: team_point_differential
        description: Points scored minus points allowed.
        agg: sum
        expr: point_differential
      - name: team_points_scored
        description: Points scored, rebuilt from the season average and games played.
        agg: sum
        expr: avg_points_scored * total_games
      - name: team_points_allowed
        description: Points allowed, rebuilt from the season average and games played.
        agg: sum
        expr: avg_points_allowed * total_games

metrics:
  - name: games
    label: Games
    description: Scheduled games, including games that have not been played.
    type: simple
    type_params:
      measure: games
  - name: played_games
    label: Played games
    description: Games with a final score.
    type: simple
    type_params:
      measure: played_games
  - name: upsets
    label: Upsets
    description: Played games the underdog won. A positive spread means the home team was favored by that many points.
    type: simple
    type_params:
      measure: upsets
  - name: upset_decisions
    label: Upset decisions
    description: Played games with a non-zero spread, so an upset can be decided.
    type: simple
    type_params:
      measure: upset_decisions
  - name: home_covers
    label: Home covers
    description: Played games where the home team beat the spread.
    type: simple
    type_params:
      measure: home_covers
  - name: spread_decisions
    label: Spread decisions
    description: Played games with a spread.
    type: simple
    type_params:
      measure: spread_decisions
  - name: total_points
    label: Total points
    description: Combined points scored in played games.
    type: simple
    type_params:
      measure: total_points
  - name: avg_total_score
    label: Average total score
    description: Average combined score of played games.
    type: simple
    type_params:
      measure: avg_total_score
  - name: avg_closing_spread
    label: Average closing spread
    description: Average closing spread. Positive means the home team was favored by that many points.
    type: simple
    type_params:
      measure: avg_closing_spread
  - name: avg_closing_total
    label: Average closing total
    description: Average closing total.
    type: simple
    type_params:
      measure: avg_closing_total
  - name: team_seasons
    label: Team seasons
    description: Team seasons with at least one played game.
    type: simple
    type_params:
      measure: team_seasons
  - name: team_wins
    label: Wins
    description: Wins in played games. A tie is not a win.
    type: simple
    type_params:
      measure: team_wins
  - name: team_games
    label: Team games
    description: Played games.
    type: simple
    type_params:
      measure: team_games
  - name: team_point_differential
    label: Point differential
    description: Points scored minus points allowed.
    type: simple
    type_params:
      measure: team_point_differential
  - name: team_points_scored
    label: Points scored
    description: Points scored, rebuilt from the season average and games played.
    type: simple
    type_params:
      measure: team_points_scored
  - name: team_points_allowed
    label: Points allowed
    description: Points allowed, rebuilt from the season average and games played.
    type: simple
    type_params:
      measure: team_points_allowed
  - name: upset_rate
    label: Upset rate
    description: Share of decided games that the underdog won.
    type: ratio
    type_params:
      numerator: upsets
      denominator: upset_decisions
  - name: home_cover_rate
    label: Home cover rate
    description: Share of decided games where the home team beat the spread.
    type: ratio
    type_params:
      numerator: home_covers
      denominator: spread_decisions
  - name: win_percentage
    label: Win percentage
    description: Wins divided by played games.
    type: ratio
    type_params:
      numerator: team_wins
      denominator: team_games
  - name: points_per_game
    label: Points per game
    description: Points scored per played game.
    type: ratio
    type_params:
      numerator: team_points_scored
      denominator: team_games
  - name: points_allowed_per_game
    label: Points allowed per game
    description: Points allowed per played game.
    type: ratio
    type_params:
      numerator: team_points_allowed
      denominator: team_games

saved_queries:
  - name: games_by_season
    label: Games by season
    description: Scheduled games, played games, upset rate, and home cover rate for each NFL season.
    query_params:
      metrics:
        - games
        - played_games
        - upsets
        - upset_rate
        - home_covers
        - home_cover_rate
        - avg_total_score
      group_by:
        - "Dimension('game__season')"
  - name: games_by_week
    label: Games by week
    description: Upset rate and home cover rate for each week of an NFL season.
    query_params:
      metrics:
        - games
        - played_games
        - upset_rate
        - home_cover_rate
      group_by:
        - "Dimension('game__season')"
        - "Dimension('game__game_week')"
  - name: team_seasons
    label: Team seasons
    description: Wins, win percentage, and points per game for each team season.
    query_params:
      metrics:
        - team_wins
        - team_games
        - win_percentage
        - points_per_game
        - points_allowed_per_game
        - team_point_differential
      group_by:
        - "Dimension('team_season__season')"
        - "Dimension('team_season__team')"
