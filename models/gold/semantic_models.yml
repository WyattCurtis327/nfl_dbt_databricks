version: 2

# Saved queries stay a top-level resource. The semantic models and metrics
# are on the gold models in schema.yml.

saved_queries:
  - name: games_by_season
    label: Games by season
    description: Scheduled games, played games, upset rate, and home cover rate for each NFL season.
    query_params:
      metrics:
        - games
        - played_games
        - upsets
        - upset_rate
        - home_covers
        - home_cover_rate
        - avg_total_score
      group_by:
        - "Dimension('game__season')"
  - name: games_by_week
    label: Games by week
    description: Upset rate and home cover rate for each week of an NFL season.
    query_params:
      metrics:
        - games
        - played_games
        - upset_rate
        - home_cover_rate
      group_by:
        - "Dimension('game__season')"
        - "Dimension('game__game_week')"
  - name: team_seasons
    label: Team seasons
    description: Wins, win percentage, and points per game for each team season.
    query_params:
      metrics:
        - team_wins
        - team_games
        - win_percentage
        - points_per_game
        - points_allowed_per_game
        - team_point_differential
      group_by:
        - "Dimension('team_season__season')"
        - "Dimension('team_season__team')"
