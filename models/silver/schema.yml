version: 2

models:
  - name: silver_games
    description: Games with a real game date, total score, and home point differential. Stored as nfl.silver.games.
    columns:
      - name: game_id
        description: "{{ doc('col_game_id') }}"
        data_tests:
          - unique
          - not_null
      - name: season
        description: "{{ doc('col_season') }}"
      - name: game_type
        description: "{{ doc('col_game_type') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ["REG", "WC", "DIV", "CON", "SB"]
      - name: week
        description: "{{ doc('col_week') }}"
      - name: weekday
        description: "{{ doc('col_weekday') }}"
      - name: gametime
        description: "{{ doc('col_gametime') }}"
      - name: away_team
        description: "{{ doc('col_away_team') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_teams')
                field: team
      - name: away_score
        description: "{{ doc('col_away_score') }}"
      - name: home_team
        description: "{{ doc('col_home_team') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_teams')
                field: team
      - name: home_score
        description: "{{ doc('col_home_score') }}"
      - name: location
        description: "{{ doc('col_location') }}"
      - name: result
        description: "{{ doc('col_result') }}"
      - name: total
        description: "{{ doc('col_total_points') }}"
      - name: overtime
        description: "{{ doc('col_overtime') }}"
      - name: old_game_id
        description: "{{ doc('col_old_game_id') }}"
      - name: gsis
        description: "{{ doc('col_gsis_game_id') }}"
      - name: nfl_detail_id
        description: "{{ doc('col_nfl_detail_id') }}"
      - name: pfr
        description: "{{ doc('col_pfr_game_id') }}"
      - name: pff
        description: "{{ doc('col_pff_game_id') }}"
      - name: espn
        description: "{{ doc('col_espn_game_id') }}"
      - name: ftn
        description: "{{ doc('col_ftn_game_id') }}"
      - name: away_rest
        description: "{{ doc('col_away_rest') }}"
      - name: home_rest
        description: "{{ doc('col_home_rest') }}"
      - name: away_moneyline
        description: "{{ doc('col_away_moneyline') }}"
      - name: home_moneyline
        description: "{{ doc('col_home_moneyline') }}"
      - name: spread_line
        description: "{{ doc('col_spread_line') }}"
      - name: away_spread_odds
        description: "{{ doc('col_away_spread_odds') }}"
      - name: home_spread_odds
        description: "{{ doc('col_home_spread_odds') }}"
      - name: total_line
        description: "{{ doc('col_total_line') }}"
      - name: under_odds
        description: "{{ doc('col_under_odds') }}"
      - name: over_odds
        description: "{{ doc('col_over_odds') }}"
      - name: div_game
        description: "{{ doc('col_div_game') }}"
      - name: roof
        description: "{{ doc('col_roof') }}"
      - name: surface
        description: "{{ doc('col_surface') }}"
      - name: temp
        description: "{{ doc('col_temp') }}"
      - name: wind
        description: "{{ doc('col_wind') }}"
      - name: away_qb_id
        description: "{{ doc('col_away_qb_id') }}"
      - name: home_qb_id
        description: "{{ doc('col_home_qb_id') }}"
      - name: away_qb_name
        description: "{{ doc('col_away_qb_name') }}"
      - name: home_qb_name
        description: "{{ doc('col_home_qb_name') }}"
